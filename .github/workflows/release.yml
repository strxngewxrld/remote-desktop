name: Release

# Gestartet durch den Tag aus tools/release.mjs. Erneut anstossen laesst sich
# ein Lauf ueber workflow_dispatch auf demselben Tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require matching release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node -e "const p=require('./packages/vscode-rdp/package.json'); if(process.env.RELEASE_REF !== 'refs/tags/v'+p.version) throw Error('Run this workflow on tag v'+p.version)"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vscode-rdp-Linux
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('packages/vscode-rdp/package.json', 'utf8'));
            const name = `${pkg.name}-${pkg.version}.vsix`;
            const data = fs.readFileSync(`artifacts/${name}`);
            // Release-Text ist die Sektion dieser Version aus dem Changelog.
            const changelog = fs.readFileSync('packages/vscode-rdp/CHANGELOG.md', 'utf8');
            const head = `## [${pkg.version}]`;
            const start = changelog.indexOf(head);
            if (start < 0) throw new Error(`CHANGELOG.md has no section ${head}`);
            const rest = changelog.slice(start + head.length);
            const next = rest.indexOf('\n## [');
            const body = (next < 0 ? rest : rest.slice(0, next)).trim();
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: `v${pkg.version}`, name: `Remote Desktop ${pkg.version}`,
              body, draft: true
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name, data,
              headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
            });
            // Erst mit angehaengtem VSIX veroeffentlichen: die Updatepruefung
            // sieht nur veroeffentlichte Releases und braucht die Datei.
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });
