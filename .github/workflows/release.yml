name: Release

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish the verified VSIX to Visual Studio Marketplace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require matching release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node -e "const p=require('./packages/vscode-rdp/package.json'); if(process.env.RELEASE_REF !== 'refs/tags/v'+p.version) throw Error('Run this workflow on tag v'+p.version)"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  draft:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vscode-rdp-Linux
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('packages/vscode-rdp/package.json', 'utf8'));
            const name = `${pkg.name}-${pkg.version}.vsix`;
            const data = fs.readFileSync(`artifacts/${name}`);
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: `v${pkg.version}`, name: `Remote Desktop ${pkg.version}`,
              draft: true, generate_release_notes: true
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name, data,
              headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
            });

  marketplace:
    if: inputs.marketplace
    needs: [checks, draft]
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode-rdp-Linux
          path: artifacts
      - name: Publish the tested artifact
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath artifacts/*.vsix
